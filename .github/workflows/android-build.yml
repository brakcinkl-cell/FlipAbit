name: Android release build

# Sadece elle tetiklenir (workflow_dispatch) - her push'ta otomatik
# çalışmaz. Bu iş akışının sebebi: android-twa/ projesi gercek Play
# Store gereksinimi olan compileSdk/targetSdk 36 + AGP 8.x kullanıyor,
# ve bu kombinasyon gelistirme bilgisayarindaki sandbox'ta calismiyor
# (JDK 16+'nin Gradle Daemon icin kullandigi AF_UNIX soketi bu sandbox'ta
# kurulamiyor - detay icin proje hafizasindaki
# project-flipabit-android-build notuna bak). GitHub'in kendi Linux
# runner'i bu sorunu yasamiyor.
#
# Cikti imzasiz (unsigned) - keystore/parola bu repoda veya CI'da
# TUTULMUYOR, indirilen .aab/.apk yerel bilgisayarda elle imzalaniyor.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-twa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner'ında Android SDK zaten kurulu geliyor
      # (ANDROID_HOME/ANDROID_SDK_ROOT hazır) - android-actions/setup-android@v3
      # eylemi artık Google'ın kaldırdığı eski bir "tools" paketini kurmaya
      # çalışıp başarısız oluyordu, o yüzden kaldırıldı. Sadece eksik olan
      # platform 36'yı runner'ın kendi sdkmanager'ıyla kuruyoruz.
      - name: Android SDK platform 36 kur
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: gradlew calistirilabilir yap
        run: chmod +x gradlew

      - name: Release AAB derle (imzasiz)
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Release APK derle (imzasiz)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ozdilek-toptan-unsigned
          path: |
            android-twa/app/build/outputs/bundle/release/*.aab
            android-twa/app/build/outputs/apk/release/*.apk
          retention-days: 14
